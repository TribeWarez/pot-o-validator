name: CI / Release

on:
  push:
    branches: [main]
    tags: ["v*", "pot-o-validator-v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  # ── CI: lint & test on ubuntu (fastest) ──────────────────────────────
  ci:
    name: CI (fmt + clippy + test)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --release

  # ── Build release binaries (triggered by tag push) ──────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pot-o-validator-v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          for bin in pot-o-validator pot-o-mml-calibrate pot-o-timing pot-o-golden-proofs; do
            src="target/${{ matrix.target }}/release/${bin}${{ matrix.suffix }}"
            if [ -f "$src" ]; then
              cp "$src" "artifacts/${bin}-${{ matrix.target }}${{ matrix.suffix }}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/

  # ── Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/pot-o-validator-v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Collect all binaries
        shell: bash
        run: |
          mkdir -p release-assets
          for dir in binaries-*/; do
            cp "$dir"/* release-assets/
          done

      - uses: softprops/action-gh-release@v2
        with:
          name: PoT-O Validator ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ${{ github.ref_name }}

            See [CHANGELOG](CHANGELOG.md) for details.
          files: release-assets/*
          draft: false
          prerelease: false
