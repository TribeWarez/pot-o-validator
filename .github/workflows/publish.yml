name: Publish to crates.io

on:
  push:
    tags:
      - 'pot-o-validator-v*'
      - 'pot-o-extensions-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pass --dry-run to cargo publish, no actual publish)'
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish crates in dependency order
        run: |
          set -euo pipefail
          UA="pot-o-validator-release"
          DRY_RUN="${{ inputs.dry_run }}"

          # "crate:manifest-dir" pairs in dependency publish order.
          # hexchain-p2p must precede pot-o-extensions (which depends on it).
          PAIRS=(
            "pot-o-core:core"
            "ai3-lib:ai3-lib"
            "pot-o-mining:mining"
            "hexchain-p2p:hexchain-p2p"
            "pot-o-extensions:extensions"
            "pot-o-validator:."
          )

          is_published() {
            curl -sf -A "$UA" "https://crates.io/api/v1/crates/$1/$2" >/dev/null 2>&1
          }

          for pair in "${PAIRS[@]}"; do
            CRATE="${pair%%:*}"
            DIR="${pair##*:}"
            VERSION=$(grep '^version' "${DIR}/Cargo.toml" | head -1 | sed 's/version = "\(.*\)".*/\1/')

            echo "::group::${CRATE} v${VERSION}"
            if is_published "${CRATE}" "${VERSION}"; then
              echo "${CRATE} v${VERSION} already published, skipping"
              echo "::endgroup::"
              continue
            fi

            EXTRA=""
            if [ "${CRATE}" = "pot-o-validator" ]; then
              EXTRA="--allow-dirty"
            fi

            if [ "${DRY_RUN}" = "true" ]; then
              cargo publish -p "${CRATE}" ${EXTRA} --dry-run
            else
              cargo publish -p "${CRATE}" ${EXTRA}
            fi

            echo "Waiting for ${CRATE} v${VERSION} to be indexed on crates.io..."
            for i in $(seq 1 40); do
              if is_published "${CRATE}" "${VERSION}"; then
                echo "${CRATE} v${VERSION} is indexed"
                break
              fi
              echo "Waiting for indexing... attempt $i/40"
              sleep 15
            done
            echo "::endgroup::"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
