name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting! Please describe your idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Consensus
        - P2P Networking
        - API/HTTP
        - Mining/PoT-O
        - Token Economics
        - Security
        - Performance
        - Developer Experience
        - Other
    validations:
      required: true
