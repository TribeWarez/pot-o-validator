[package]
name = "pot-o-validator"
version = "0.9.10"
edition = "2021"
authors = ["TribeWarez"]
description = "PoT-O (Proof of Tensor Optimizations) Validator Service"
license = "GPL-3.0"
repository = "https://github.com/tribewarez/pot-o-validator"
homepage = "https://pot.rpc.gateway.tribewarez.com"
documentation = "https://docs.rs/pot-o-validator"
readme = "README.md"
keywords = ["pot-o", "tribewarez", "blockchain", "validator", "mining"]
categories = ["cryptography", "development-tools"]

[workspace]
members = [
    "core",
    "ai3-lib",
    "mining",
    "extensions",
    "hexchain-p2p",
]

# Use workspace members when building in-repo; published crates use crates.io
[patch.crates-io]
pot-o-core = { path = "core" }
ai3-lib = { path = "ai3-lib" }
pot-o-mining = { path = "mining" }
pot-o-extensions = { path = "extensions" }
hexchain-p2p = { path = "hexchain-p2p" }

[dependencies]
pot-o-core = { path = "core", version = "0.9" }
ai3-lib = { path = "ai3-lib", version = "0.9" }
pot-o-mining = { path = "mining", version = "0.9" }
pot-o-extensions = { path = "extensions", version = "0.9" }
hexchain-p2p = { path = "hexchain-p2p", version = "0.9" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = "2"
bs58 = "0.5"
rand = "0.8"
tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
toml = "0.8"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.8"
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "pot-o-validator"
path = "src/main.rs"

[[bin]]
name = "pot-o-mml-calibrate"
path = "src/bin/pot_o_mml_calibrate.rs"

[[bin]]
name = "pot-o-timing"
path = "src/bin/pot_o_timing.rs"

[[bin]]
name = "pot-o-golden-proofs"
path = "src/bin/pot_o_golden_proofs.rs"

[[bin]]
name = "tribechain-genesis"
path = "src/bin/tribechain-genesis.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
