[package]
name = "pot-o-extensions"
version = "0.9.12"
edition = "2021"
authors = ["TribeWarez"]
description = "DeFi, staking, and external-chain extensions for the PoT-O validator"
license = "GPL-3.0"
repository = "https://github.com/tribewarez/pot-o-extensions"
homepage = "https://pot.rpc.gateway.tribewarez.com"
documentation = "https://docs.rs/pot-o-extensions"
readme = "README.md"
keywords = ["pot-o", "tribewarez", "blockchain", "defi", "staking"]
categories = ["cryptography", "development-tools"]

[dependencies]
pot-o-core = "0.9"
ai3-lib = "0.9"
pot-o-mining = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
tracing = "0.1"
anyhow = "1.0"
hex = "0.4"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json"] }
mdns-sd = "0.7"
flume = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
bs58 = "0.4"
hexchain-p2p = "0.9"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
mockito = "1.2"
tempfile = "3.8"
